worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    server_names_hash_bucket_size 128;
    proxy_cache_path /tmp/nginx_betby levels=1:2 keys_zone=betby_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream betby_demo {
        server demo.betby.com:443;
        keepalive 32;
    }

    upstream betby_api {
        server api-h-c7818b61-608.sptpub.com:443;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  sportsbook.bet62.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sportsbook.bet62.local;

        ssl_certificate     ssl/localhost.pem;
        ssl_certificate_key ssl/localhost-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        set $BETBY_ORIGIN "https://demo.betby.com";

        proxy_set_header Host "demo.betby.com";
        proxy_set_header Origin $BETBY_ORIGIN;
        proxy_set_header Referer "$BETBY_ORIGIN/";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Accept-Encoding "";

        proxy_ssl_server_name on;
        proxy_ssl_name "demo.betby.com";
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering on;

        location /api/ {
            proxy_pass https://betby_demo/api/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_hide_header "x-frame-options";
            proxy_hide_header "set-cookie";
            add_header "Access-Control-Allow-Origin" "*" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, Accept, Origin" always;
            expires 5s;
        }

        location /api-spt/ {
            rewrite ^/api-spt/(.*)$ /$1 break;
            proxy_pass https://betby_api;
            proxy_set_header Host "api-h-c7818b61-608.sptpub.com";
            proxy_ssl_name "api-h-c7818b61-608.sptpub.com";
            proxy_hide_header "content-security-policy";
            proxy_hide_header "x-frame-options";
            add_header "Access-Control-Allow-Origin" "*" always;
        }

        location /sportsbook/ {
            proxy_pass https://betby_demo/sportsbook/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_hide_header "x-frame-options";
            proxy_hide_header "frame-options";
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/css;
            sub_filter 'https://demo.betby.com' '/';
            sub_filter 'demo.betby.com' $host;
            sub_filter 'api-h-c7818b61-608.sptpub.com' '$host/api-spt';
        }

        location /_next/ {
            proxy_pass https://betby_demo/_next/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_hide_header "x-frame-options";
            proxy_cache betby_cache;
            proxy_cache_valid 200 302 1h;
            expires 1h;
        }

        location /static/ {
            proxy_pass https://betby_demo/static/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_cache betby_cache;
            proxy_cache_valid 200 302 7d;
            expires 7d;
        }

        location /assets/ {
            proxy_pass https://betby_demo/assets/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_cache betby_cache;
            proxy_cache_valid 200 302 7d;
            expires 7d;
        }

        location /__nextjs_original-stack-frame {
            proxy_pass https://betby_demo/__nextjs_original-stack-frame;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
        }

        location = / {
            return 302 /sportsbook/tile/?_gl=1*5b9qwe*_gcl_au*MTQ5NDg1NjMyOC4xNzg1NjkxODYy;
        }

        location / {
            proxy_pass https://betby_demo/;
            proxy_set_header Host "demo.betby.com";
            proxy_ssl_name "demo.betby.com";
            proxy_hide_header "content-security-policy";
            proxy_hide_header "x-frame-options";
            sub_filter_once off;
            sub_filter_types text/html application/javascript;
            sub_filter 'https://demo.betby.com' '/';
            sub_filter 'demo.betby.com' $host;
            sub_filter 'api-h-c7818b61-608.sptpub.com' '$host/api-spt';
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
